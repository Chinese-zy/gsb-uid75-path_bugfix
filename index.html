<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>路径</title>
  <style>
    body { margin: 0; background: #f6f3ee; color: #1c1917; font: 15px/1.4 "Songti SC", serif; }
    header { padding: 16px 20px 0; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0; color: #57534e; }
    canvas { display: block; margin: 12px 20px 20px; background: #fffdf8; border: 1px solid #d6d3d1; cursor: crosshair; }
  </style>
</head>
<body>
  <header>
    <h1>路径</h1>
    <p>橙点是闭合那截的手柄，拖它：红的是修好的配对手柄，灰虚线是旧的，拖过锚点那条竖虚线会突然翻到对面。下面两处圆角半径都是 16：红的按夹角贴着切，粉虚线圆是半径 16 的切圆，灰虚线是旧的按边长切。灰点是开口二次上库算出来的位置。</p>
  </header>
  <canvas id="c" width="920" height="460"></canvas>
  <script src="geom.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const anchor = { x: 620, y: 150 };
    let handle = { x: 500, y: 150 };
    const far = { x: 760, y: 70 };
    const low = { x: 780, y: 250 };
    const openA = { x: 36, y: 150 };
    const openC = { x: 110, y: 28 };
    const openB = { x: 196, y: 156 };
    const sharp = [{ x: 40, y: 250 }, { x: 40, y: 400 }, { x: 58, y: 404 }];
    const blunt = [{ x: 120, y: 330 }, { x: 280, y: 330 }, { x: 430, y: 360 }];
    let samples = [];
    let dragging = false;

    function legacyClosedHandle(a, h) {
      let dx = h.x - a.x;
      let dy = h.y - a.y;
      if (dx < 0) {
        dx = -dx;
        dy = -dy;
      }
      return { x: a.x - dx, y: a.y - dy };
    }

    function legacyFillet(prev, corner, next) {
      const ab = Geom.dist(prev, corner) || 1;
      const cb = Geom.dist(next, corner) || 1;
      const cut = Math.min(ab, cb) * 0.45;
      return {
        p1: { x: corner.x + ((prev.x - corner.x) * cut) / ab, y: corner.y + ((prev.y - corner.y) * cut) / ab },
        p2: { x: corner.x + ((next.x - corner.x) * cut) / cb, y: corner.y + ((next.y - corner.y) * cut) / cb },
      };
    }

    function stroke(points, color, width, dash) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function curve(a, c1, c2, b, color, dash) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.bezierCurveTo(c1.x, c1.y, c2.x, c2.y, b.x, b.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function quad(p1, c, p2, color, dash) {
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(c.x, c.y, p2.x, p2.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function dot(p, color, r) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    function circle(p, r, color, dash) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawFillet(poly) {
      const old = legacyFillet(poly[0], poly[1], poly[2]);
      const cut = Geom.fillet(poly[0], poly[1], poly[2], 16);
      stroke(poly, "#d6d3d1", 1);
      quad(old.p1, poly[1], old.p2, "#a8a29e", [4, 4]);
      dot(old.p1, "#a8a29e", 2.5);
      dot(old.p2, "#a8a29e", 2.5);
      stroke([poly[0], cut.p1], "#1c1917", 2);
      stroke([cut.p2, poly[2]], "#1c1917", 2);
      if (cut.radius > 0.5) circle(cut.center, cut.radius, "#f9a8d4", [3, 3]);
      quad(cut.p1, poly[1], cut.p2, "#9f1239");
      dot(cut.p1, "#9f1239", 3);
      dot(cut.p2, "#9f1239", 3);
    }

    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#78716c";
      ctx.font = "14px Songti SC";
      ctx.fillText("开口", 36, 24);
      ctx.fillText("闭合（拖橙点过竖虚线）", 500, 24);
      ctx.fillText("尖角 r=16", 40, 230);
      ctx.fillText("钝角 r=16", 120, 300);

      const pts = [];
      for (let i = 0; i <= 24; i++) pts.push(Geom.quadPoint(openA, openC, openB, i / 24));
      stroke(pts, "#1c1917", 2);
      for (const p of samples) dot(p, "#a8a29e", 3);

      const back = Geom.closedHandle(anchor, handle);
      const backOld = legacyClosedHandle(anchor, handle);
      const mid = { x: (far.x + low.x) / 2, y: (far.y + low.y) / 2 - 30 };
      stroke([{ x: anchor.x, y: 40 }, { x: anchor.x, y: 280 }], "#e7e5e4", 1, [3, 4]);
      curve(anchor, handle, { x: far.x - 40, y: far.y + 20 }, far, "#1c1917");
      curve(far, { x: far.x + 10, y: far.y + 40 }, mid, low, "#1c1917");
      curve(low, { x: low.x - 30, y: low.y - 10 }, backOld, anchor, "#a8a29e", [5, 4]);
      curve(low, { x: low.x - 30, y: low.y - 10 }, back, anchor, "#9f1239");
      dot(backOld, "#a8a29e", 3);
      dot(back, "#9f1239", 4);
      dot(anchor, "#1c1917", 4);
      dot(handle, "#c2410c", 6);
      stroke([anchor, handle], "#c2410c", 1);
      stroke([anchor, back], "#9f1239", 1);

      drawFillet(sharp);
      drawFillet(blunt);
    }

    canvas.addEventListener("mousedown", (ev) => {
      const r = canvas.getBoundingClientRect();
      const x = (ev.clientX - r.left) * (canvas.width / r.width);
      const y = (ev.clientY - r.top) * (canvas.height / r.height);
      if (Math.hypot(x - handle.x, y - handle.y) < 12) dragging = true;
    });
    window.addEventListener("mousemove", (ev) => {
      if (!dragging) return;
      const r = canvas.getBoundingClientRect();
      handle = {
        x: (ev.clientX - r.left) * (canvas.width / r.width),
        y: (ev.clientY - r.top) * (canvas.height / r.height),
      };
      frame();
    });
    window.addEventListener("mouseup", () => { dragging = false; });

    fetch("/api/quad").then((res) => res.json()).then((data) => {
      samples = data.samples || [];
      frame();
    }).catch(() => frame());
    frame();
  </script>
</body>
</html>
